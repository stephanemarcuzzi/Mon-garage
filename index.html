<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Mon Garage</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f172a'/%3E%3Ccircle cx='32' cy='32' r='18' fill='none' stroke='%233b82f6' stroke-width='5'/%3E%3Ccircle cx='32' cy='32' r='6' fill='%23f8fafc'/%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f172a'/%3E%3Ccircle cx='32' cy='32' r='18' fill='none' stroke='%233b82f6' stroke-width='5'/%3E%3Ccircle cx='32' cy='32' r='6' fill='%23f8fafc'/%3E%3C/svg%3E">

  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-hover: #273549;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --radius: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 40px; }

    header {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 14px 18px;
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.2rem; cursor: pointer; }
    .brand span { background: var(--primary); padding: 6px 10px; border-radius: 10px; font-size: 1rem; }

    .header-actions { display: flex; gap: 8px; flex-wrap: wrap; }

    button, .btn {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: 0.15s;
    }
    button:hover { background: var(--surface-hover); }
    button.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    button.primary:hover { background: var(--primary-hover); }
    button.danger { background: rgba(239, 68, 68, 0.15); border-color: var(--danger); color: #fca5a5; }
    button.success { background: rgba(16, 185, 129, 0.15); border-color: var(--success); color: #6ee7b7; }
    button.sm { padding: 5px 10px; font-size: 0.8rem; }

    main { max-width: 1000px; margin: 0 auto; padding: 20px 16px; }

    .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; gap: 10px; flex-wrap: wrap; }
    .section-title { font-size: 1.35rem; font-weight: 700; }

    /* Grille des véhicules */
    .vehicles-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 18px;
    }

    .vehicle-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: transform 0.15s, border-color 0.15s;
      display: flex;
      flex-direction: column;
    }
    .vehicle-card:hover { transform: translateY(-2px); border-color: var(--primary); }

    .vehicle-cover {
      height: 170px;
      background: #0b1120;
      position: relative;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .vehicle-cover img { width: 100%; height: 100%; object-fit: cover; }
    .vehicle-placeholder { font-size: 3.5rem; opacity: 0.7; }

    .badge-type {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(15, 23, 42, 0.85);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      border: 1px solid var(--border);
    }

    .badge-alert {
      position: absolute;
      top: 10px;
      right: 10px;
      background: var(--danger);
      color: #fff;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .badge-alert.warn { background: var(--warning); color: #0f172a; }

    .vehicle-body { padding: 16px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; gap: 12px; }
    .vehicle-title { font-size: 1.15rem; font-weight: 700; cursor: pointer; }
    .vehicle-sub { color: var(--text-muted); font-size: 0.85rem; margin-top: 2px; }

    .km-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg);
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    .km-val { font-weight: 700; font-size: 1rem; color: #60a5fa; }

    /* Vue détail véhicule */
    .detail-hero {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      display: flex;
      gap: 18px;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .detail-photo {
      width: 140px;
      height: 105px;
      border-radius: 10px;
      object-fit: cover;
      background: #0b1120;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      flex-shrink: 0;
    }
    .detail-info { flex: 1; min-width: 220px; }

    /* Catégories d'entretien */
    .cat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }
    .cat-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 10px;
      text-align: center;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      transition: 0.15s;
    }
    .cat-btn:hover { border-color: var(--primary); background: var(--surface-hover); }
    .cat-icon { font-size: 1.7rem; }
    .cat-label { font-size: 0.88rem; font-weight: 600; }

    /* Rappels */
    .reminders-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }
    .reminder-card {
      background: var(--surface);
      border-left: 4px solid var(--success);
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .reminder-card.warn { border-left-color: var(--warning); }
    .reminder-card.due { border-left-color: var(--danger); }

    /* Historique */
    .history-list { display: flex; flex-direction: column; gap: 12px; }
    .history-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
    }
    .history-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
    .history-cat { font-weight: 700; font-size: 1.05rem; color: #93c5fd; }
    .history-meta { font-size: 0.85rem; color: var(--text-muted); }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
    .tag {
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.4);
      color: #bfdbfe;
      padding: 3px 9px;
      border-radius: 6px;
      font-size: 0.8rem;
    }
    .history-notes { font-size: 0.9rem; color: #cbd5e1; margin-top: 6px; white-space: pre-wrap; }
    .attachments { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

    /* Modales */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.8);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
      overflow-y: auto;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 100%;
      max-width: 560px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 20px;
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .modal-title { font-size: 1.2rem; font-weight: 700; }

    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 5px; font-weight: 600; }
    input, select, textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 0.95rem;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); }

    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .checklist {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 8px;
      background: var(--bg);
      padding: 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    .check-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.88rem;
      color: var(--text);
      cursor: pointer;
      margin: 0;
    }
    .check-item input { width: auto; accent-color: var(--primary); }

    .preview-box {
      max-width: 100%;
      max-height: 70vh;
      display: block;
      margin: 0 auto;
      border-radius: 8px;
    }

    .empty-state {
      text-align: center;
      padding: 30px;
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      color: var(--text-muted);
    }
  </style>
</head>
<body>

<header>
  <div class="brand" onclick="showHome()">
    <span>🔧</span> Mon Garage
  </div>
  <div class="header-actions">
    <button onclick="exportData()" title="Télécharger une sauvegarde JSON">💾 Sauvegarder</button>
    <button onclick="document.getElementById('importFile').click()" title="Importer une sauvegarde JSON">📂 Restaurer</button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)" />
  </div>
</header>

<main id="app"></main>

<!-- MODALE VEHICULE -->
<div class="modal-backdrop" id="vehicleModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="vehicleModalTitle">Ajouter un véhicule</div>
      <button class="sm" onclick="closeModal('vehicleModal')">✕</button>
    </div>
    <form onsubmit="saveVehicle(event)">
      <input type="hidden" id="vId" />
      <div class="row-2">
        <div class="form-group">
          <label>Type</label>
          <select id="vType" required>
            <option value="car">🚗 Voiture</option>
            <option value="moto">🏍️ Moto</option>
          </select>
        </div>
        <div class="form-group">
          <label>Kilométrage actuel (km)</label>
          <input type="number" id="vKm" required min="0" placeholder="Ex: 145000" />
        </div>
      </div>
      <div class="form-group">
        <label>Modèle / Nom</label>
        <input type="text" id="vName" required placeholder="Ex: BMW 325ti ou Suzuki DR 125" />
      </div>
      <div class="row-2">
        <div class="form-group">
          <label>Immatriculation</label>
          <input type="text" id="vPlate" placeholder="Ex: AA-123-BB" />
        </div>
        <div class="form-group">
          <label>Année / Motorisation</label>
          <input type="text" id="vDetails" placeholder="Ex: 2002 - M54 2.5" />
        </div>
      </div>
      <div class="form-group">
        <label>Photo du véhicule (compressée auto)</label>
        <input type="file" id="vPhoto" accept="image/*" />
      </div>
      <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:16px;">
        <button type="button" onclick="closeModal('vehicleModal')">Annuler</button>
        <button type="submit" class="primary">Enregistrer</button>
      </div>
    </form>
  </div>
</div>

<!-- MODALE INTERVENTION -->
<div class="modal-backdrop" id="serviceModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="serviceModalTitle">Nouvel entretien</div>
      <button class="sm" onclick="closeModal('serviceModal')">✕</button>
    </div>
    <form onsubmit="saveService(event)">
      <input type="hidden" id="sVehicleId" />
      <div class="form-group">
        <label>Catégorie</label>
        <select id="sCategory" onchange="renderChecklist()" required></select>
      </div>
      <div class="row-2">
        <div class="form-group">
          <label>Date</label>
          <input type="date" id="sDate" required />
        </div>
        <div class="form-group">
          <label>Kilométrage (km)</label>
          <input type="number" id="sKm" required min="0" />
        </div>
      </div>
      <div class="form-group">
        <label>Éléments remplacés / contrôlés</label>
        <div class="checklist" id="sChecklist"></div>
      </div>
      <div class="form-group">
        <label>Autre pièce personnalisée (séparée par virgule)</label>
        <input type="text" id="sCustomItems" placeholder="Ex: Joint cache-culbuteurs, capteur AAC..." />
      </div>
      <div class="row-2">
        <div class="form-group">
          <label>Prochain rappel dans (km) — optionnel</label>
          <input type="number" id="sRemindKm" min="0" placeholder="Ex: 10000" />
        </div>
        <div class="form-group">
          <label>Ou dans (mois) — optionnel</label>
          <input type="number" id="sRemindMonths" min="0" placeholder="Ex: 12" />
        </div>
      </div>
      <div class="form-group">
        <label>Notes (références pièces, huile, couple de serrage, prix...)</label>
        <textarea id="sNotes" rows="3" placeholder="Ex: Huile 5W40 LL01, filtre Mann HU925/4x..."></textarea>
      </div>
      <div class="form-group">
        <label>Facture / Ticket (Photo ou PDF)</label>
        <input type="file" id="sAttachment" accept="image/*,application/pdf" />
      </div>
      <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:16px;">
        <button type="button" onclick="closeModal('serviceModal')">Annuler</button>
        <button type="submit" class="primary">Enregistrer l'entretien</button>
      </div>
    </form>
  </div>
</div>

<!-- MODALE APERCU PIECE JOINTE -->
<div class="modal-backdrop" id="previewModal">
  <div class="modal" style="max-width: 720px;">
    <div class="modal-header">
      <div class="modal-title" id="previewTitle">Justificatif</div>
      <button class="sm" onclick="closeModal('previewModal')">✕</button>
    </div>
    <div id="previewContent" style="text-align:center;"></div>
  </div>
</div>

<script>
  const CATEGORIES = {
    car: [
      { id: 'vidange', icon: '🛢️', label: 'Vidange & Filtres', items: ['Huile moteur', 'Filtre à huile', 'Joint de bouchon', 'Filtre à air', 'Filtre habitacle', 'Filtre carburant'] },
      { id: 'freins', icon: '🛑', label: 'Freinage', items: ['Plaquettes AV', 'Plaquettes AR', 'Disques AV', 'Disques AR', 'Capteur usure AV', 'Capteur usure AR', 'Purge liquide de frein', 'Étriers / Colonnettes'] },
      { id: 'liquides', icon: '💧', label: 'Liquides & Refroid.', items: ['Liquide de refroidissement', 'Pompe à eau', 'Thermostat', 'Huile de boîte', 'Huile de pont', 'Liquide direction assistée'] },
      { id: 'moteur', icon: '⚙️', label: 'Moteur & Allumage', items: ['Bougies allumage', 'Bougies préchauffage', 'Bobines', 'Courroie accessoires', 'Galets / Tendeur', 'Kit distribution', 'Débitmètre / Capteurs'] },
      { id: 'chassis', icon: '🛞', label: 'Pneus & Trains roulants', items: ['Pneus AV', 'Pneus AR', 'Silentblocs triangles', 'Rotules / Biellettes', 'Amortisseurs AV', 'Amortisseurs AR', 'Géométrie / Parallélisme'] },
      { id: 'autre', icon: '🔋', label: 'Batterie & Divers', items: ['Batterie', 'Essuie-glaces', 'Ampoules / LED', 'Contrôle technique', 'Diagnostic OBD'] }
    ],
    moto: [
      { id: 'vidange', icon: '🛢️', label: 'Vidange & Filtration', items: ['Huile moteur', 'Filtre à huile', 'Joint torique / bouchon', 'Crépine nettoyée', 'Filtre à air'] },
      { id: 'transmission', icon: '⛓️', label: 'Kit Chaîne & Transm.', items: ['Chaîne', 'Pignon sortie boîte', 'Couronne', 'Nettoyage / Graissage chaîne', 'Tension chaîne'] },
      { id: 'freins', icon: '🛑', label: 'Freinage', items: ['Plaquettes AV', 'Plaquettes AR', 'Disque AV', 'Disque AR', 'Purge liquide frein AV', 'Purge liquide frein AR'] },
      { id: 'moteur', icon: '🏍️', label: 'Moteur & Carbu/Inj.', items: ['Bougie(s)', 'Jeu aux soupapes', 'Nettoyage carburateur', 'Kit réfection carbu', 'Synchronisation', 'Liquide refroidissement'] },
      { id: 'partiecycle', icon: '🔧', label: 'Fourche & Pneus', items: ['Pneu AV', 'Pneu AR', 'Chambre à air', 'Huile de fourche', 'Joints spi fourche', 'Roulements de roue', 'Roulements direction'] },
      { id: 'autre', icon: '🔋', label: 'Batterie & Câbles', items: ['Batterie', 'Câble embrayage', 'Câble accélérateur', 'Éclairage', 'Contrôle technique'] }
    ]
  };

  let state = {
    vehicles: [],
    services: [],
    currentVehicleId: null
  };

  function loadState() {
    const saved = localStorage.getItem('mon_garage_data_v1');
    if (saved) {
      try {
        state = JSON.parse(saved);
        return;
      } catch (e) { console.error(e); }
    }
    // Données d'exemple au premier lancement
    state.vehicles = [
      { id: 'v1', type: 'car', name: 'BMW 325ti (E46)', plate: 'EX-325-TI', details: '2002 • M54B25', km: 214500, photo: '' },
      { id: 'v2', type: 'moto', name: 'Suzuki DR 125', plate: 'EX-125-DR', details: 'Monocylindre 4T', km: 18200, photo: '' }
    ];
    state.services = [
      {
        id: 's1', vehicleId: 'v1', categoryId: 'vidange', categoryLabel: 'Vidange & Filtres',
        date: '2026-10-15', km: 213000,
        items: ['Huile moteur', 'Filtre à huile', 'Joint de bouchon'],
        notes: 'Castrol Edge 5W40 + Filtre Mann',
        remindKm: 10000, remindMonths: 12, attachment: null
      }
    ];
    saveState();
  }

  function saveState() {
    try {
      localStorage.setItem('mon_garage_data_v1', JSON.stringify(state));
    } catch (e) {
      alert("Attention : espace de stockage du navigateur plein (photos/PDF trop lourds). Pensez à sauvegarder votre fichier JSON.");
    }
  }

  function showHome() {
    state.currentVehicleId = null;
    render();
  }

  function openVehicle(id) {
    state.currentVehicleId = id;
    render();
  }

  function getVehicleReminders(vehicle) {
    const vServices = state.services.filter(s => s.vehicleId === vehicle.id && (s.remindKm || s.remindMonths));
    // Garder uniquement le dernier entretien par catégorie ayant un rappel
    const latestByCat = {};
    vServices.sort((a, b) => new Date(a.date) - new Date(b.date)).forEach(s => {
      latestByCat[s.categoryId] = s;
    });

    const alerts = [];
    const now = new Date();

    Object.values(latestByCat).forEach(s => {
      let status = 'ok';
      let msgParts = [];

      if (s.remindKm) {
        const targetKm = Number(s.km) + Number(s.remindKm);
        const diffKm = targetKm - Number(vehicle.km);
        if (diffKm <= 0) {
          status = 'due';
          msgParts.push(`Dépassé de ${Math.abs(diffKm).toLocaleString()} km (échéance ${targetKm.toLocaleString()} km)`);
        } else if (diffKm <= 1000) {
          if (status !== 'due') status = 'warn';
          msgParts.push(`Dans ${diffKm.toLocaleString()} km (${targetKm.toLocaleString()} km)`);
        } else {
          msgParts.push(`Dans ${diffKm.toLocaleString()} km`);
        }
      }

      if (s.remindMonths) {
        const targetDate = new Date(s.date);
        targetDate.setMonth(targetDate.getMonth() + Number(s.remindMonths));
        const diffDays = Math.ceil((targetDate - now) / (1000 * 60 * 60 * 24));
        const dateStr = targetDate.toLocaleDateString('fr-FR');
        if (diffDays <= 0) {
          status = 'due';
          msgParts.push(`Date dépassée (${dateStr})`);
        } else if (diffDays <= 30) {
          if (status !== 'due') status = 'warn';
          msgParts.push(`Dans ${diffDays} j (${dateStr})`);
        } else {
          msgParts.push(`Avant le ${dateStr}`);
        }
      }

      alerts.push({
        service: s,
        status,
        text: msgParts.join(' • ')
      });
    });

    return alerts;
  }

  function render() {
    const app = document.getElementById('app');
    if (!state.currentVehicleId) {
      renderHome(app);
    } else {
      renderVehicleDetail(app);
    }
  }

  function renderHome(app) {
    let html = `
      <div class="section-header">
        <div class="section-title">Mes Véhicules (${state.vehicles.length})</div>
        <button class="primary" onclick="openVehicleModal()">+ Ajouter un véhicule</button>
      </div>
    `;

    if (state.vehicles.length === 0) {
      html += `<div class="empty-state">Aucun véhicule enregistré. Cliquez sur <b>+ Ajouter un véhicule</b> pour démarrer.</div>`;
      app.innerHTML = html;
      return;
    }

    html += `<div class="vehicles-grid">`;
    state.vehicles.forEach(v => {
      const reminders = getVehicleReminders(v);
      const dueCount = reminders.filter(r => r.status === 'due').length;
      const warnCount = reminders.filter(r => r.status === 'warn').length;

      let alertBadge = '';
      if (dueCount > 0) alertBadge = `<div class="badge-alert">⚠️ ${dueCount} entretien(s) dû(s)</div>`;
      else if (warnCount > 0) alertBadge = `<div class="badge-alert warn">⏳ ${warnCount} à prévoir</div>`;

      html += `
        <div class="vehicle-card">
          <div class="vehicle-cover" onclick="openVehicle('${v.id}')">
            <div class="badge-type">${v.type === 'moto' ? '🏍️ Moto' : '🚗 Voiture'}</div>
            ${alertBadge}
            ${v.photo ? `<img src="${v.photo}" alt="${v.name}">` : `<div class="vehicle-placeholder">${v.type === 'moto' ? '🏍️' : '🚗'}</div>`}
          </div>
          <div class="vehicle-body">
            <div>
              <div class="vehicle-title" onclick="openVehicle('${v.id}')">${v.name}</div>
              <div class="vehicle-sub">${[v.plate, v.details].filter(Boolean).join(' • ') || 'Cliquez pour ouvrir'}</div>
            </div>
            <div class="km-bar">
              <span class="km-val">${Number(v.km).toLocaleString()} km</span>
              <button class="sm" onclick="quickUpdateKm('${v.id}')">✏️ MàJ km</button>
            </div>
          </div>
        </div>
      `;
    });
    html += `</div>`;
    app.innerHTML = html;
  }

  function renderVehicleDetail(app) {
    const v = state.vehicles.find(item => item.id === state.currentVehicleId);
    if (!v) return showHome();

    const cats = CATEGORIES[v.type] || CATEGORIES.car;
    const reminders = getVehicleReminders(v);
    const vServices = state.services
      .filter(s => s.vehicleId === v.id)
      .sort((a, b) => new Date(b.date) - new Date(a.date));

    let html = `
      <div class="section-header">
        <button onclick="showHome()">← Retour au garage</button>
        <div style="display:flex; gap:8px;">
          <button onclick="openVehicleModal('${v.id}')">✏️ Modifier</button>
          <button class="danger" onclick="deleteVehicle('${v.id}')">🗑️ Supprimer</button>
        </div>
      </div>

      <div class="detail-hero">
        ${v.photo
          ? `<img src="${v.photo}" class="detail-photo" alt="${v.name}">`
          : `<div class="detail-photo">${v.type === 'moto' ? '🏍️' : '🚗'}</div>`}
        <div class="detail-info">
          <div style="font-size:1.4rem; font-weight:700;">${v.name}</div>
          <div style="color:var(--text-muted); margin:4px 0 10px;">${[v.plate, v.details].filter(Boolean).join(' • ')}</div>
          <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
            <span class="km-val" style="font-size:1.15rem;">${Number(v.km).toLocaleString()} km</span>
            <button class="sm" onclick="quickUpdateKm('${v.id}')">Mettre à jour le compteur</button>
          </div>
        </div>
      </div>

      <h3 style="margin-bottom:12px;">➕ Enregistrer une intervention</h3>
      <div class="cat-grid">
        ${cats.map(c => `
          <div class="cat-btn" onclick="openServiceModal('${v.id}', '${c.id}')">
            <div class="cat-icon">${c.icon}</div>
            <div class="cat-label">${c.label}</div>
          </div>
        `).join('')}
      </div>
    `;

    if (reminders.length > 0) {
      html += `<h3 style="margin-bottom:12px;">🔔 Suivi des échéances & rappels</h3><div class="reminders-list">`;
      reminders.forEach(r => {
        html += `
          <div class="reminder-card ${r.status}">
            <div>
              <div style="font-weight:700;">${r.service.categoryLabel}</div>
              <div style="font-size:0.85rem; color:var(--text-muted);">${r.text}</div>
            </div>
            <button class="sm" onclick="downloadICS('${v.name}', '${r.service.categoryLabel}', '${r.service.date}', ${r.service.remindMonths || 12})">📅 Agenda</button>
          </div>
        `;
      });
      html += `</div>`;
    }

    html += `<h3 style="margin-bottom:12px;">📋 Historique des entretiens (${vServices.length})</h3>`;
    if (vServices.length === 0) {
      html += `<div class="empty-state">Aucun entretien enregistré pour ce véhicule. Choisissez une catégorie ci-dessus.</div>`;
    } else {
      html += `<div class="history-list">`;
      vServices.forEach(s => {
        const dateFormatted = new Date(s.date).toLocaleDateString('fr-FR');
        html += `
          <div class="history-card">
            <div class="history-top">
              <div>
                <div class="history-cat">${s.categoryLabel}</div>
                <div class="history-meta">Le ${dateFormatted} à <b>${Number(s.km).toLocaleString()} km</b></div>
              </div>
              <button class="sm danger" onclick="deleteService('${s.id}')">🗑️</button>
            </div>
            ${s.items && s.items.length ? `<div class="tags">${s.items.map(i => `<span class="tag">✓ ${i}</span>`).join('')}</div>` : ''}
            ${s.notes ? `<div class="history-notes">${s.notes}</div>` : ''}
            ${s.attachment ? `
              <div class="attachments">
                <button class="sm success" onclick="viewAttachment('${s.id}')">📎 Voir la facture (${s.attachment.type.includes('pdf') ? 'PDF' : 'Photo'})</button>
              </div>
            ` : ''}
          </div>
        `;
      });
      html += `</div>`;
    }

    app.innerHTML = html;
  }

  // Gestion Véhicules
  function openVehicleModal(id = null) {
    document.getElementById('vPhoto').value = '';
    if (id) {
      const v = state.vehicles.find(item => item.id === id);
      document.getElementById('vehicleModalTitle').textContent = 'Modifier le véhicule';
      document.getElementById('vId').value = v.id;
      document.getElementById('vType').value = v.type;
      document.getElementById('vName').value = v.name;
      document.getElementById('vPlate').value = v.plate || '';
      document.getElementById('vDetails').value = v.details || '';
      document.getElementById('vKm').value = v.km;
    } else {
      document.getElementById('vehicleModalTitle').textContent = 'Ajouter un véhicule';
      document.getElementById('vId').value = '';
      document.getElementById('vType').value = 'car';
      document.getElementById('vName').value = '';
      document.getElementById('vPlate').value = '';
      document.getElementById('vDetails').value = '';
      document.getElementById('vKm').value = '';
    }
    document.getElementById('vehicleModal').classList.add('open');
  }

  async function saveVehicle(e) {
    e.preventDefault();
    const id = document.getElementById('vId').value;
    const type = document.getElementById('vType').value;
    const name = document.getElementById('vName').value.trim();
    const plate = document.getElementById('vPlate').value.trim();
    const details = document.getElementById('vDetails').value.trim();
    const km = Number(document.getElementById('vKm').value);
    const fileInput = document.getElementById('vPhoto');

    let photoData = null;
    if (fileInput.files && fileInput.files[0]) {
      photoData = await compressImage(fileInput.files[0], 800, 0.75);
    }

    if (id) {
      const idx = state.vehicles.findIndex(v => v.id === id);
      if (idx !== -1) {
        state.vehicles[idx] = {
          ...state.vehicles[idx],
          type, name, plate, details, km,
          photo: photoData || state.vehicles[idx].photo
        };
      }
    } else {
      state.vehicles.push({
        id: 'v_' + Date.now(),
        type, name, plate, details, km,
        photo: photoData || ''
      });
    }

    saveState();
    closeModal('vehicleModal');
    render();
  }

  function quickUpdateKm(id) {
    const v = state.vehicles.find(item => item.id === id);
    if (!v) return;
    const val = prompt(`Nouveau kilométrage pour ${v.name} (actuel : ${v.km} km) :`, v.km);
    if (val !== null && !isNaN(Number(val)) && Number(val) >= 0) {
      v.km = Number(val);
      saveState();
      render();
    }
  }

  function deleteVehicle(id) {
    if (!confirm('Supprimer ce véhicule et tout son historique ?')) return;
    state.vehicles = state.vehicles.filter(v => v.id !== id);
    state.services = state.services.filter(s => s.vehicleId !== id);
    saveState();
    showHome();
  }

  // Gestion Entretiens
  function openServiceModal(vehicleId, categoryId) {
    const v = state.vehicles.find(item => item.id === vehicleId);
    if (!v) return;

    document.getElementById('sVehicleId').value = vehicleId;
    document.getElementById('sDate').value = new Date().toISOString().split('T')[0];
    document.getElementById('sKm').value = v.km;
    document.getElementById('sCustomItems').value = '';
    document.getElementById('sRemindKm').value = '';
    document.getElementById('sRemindMonths').value = '';
    document.getElementById('sNotes').value = '';
    document.getElementById('sAttachment').value = '';

    const cats = CATEGORIES[v.type] || CATEGORIES.car;
    const select = document.getElementById('sCategory');
    select.innerHTML = cats.map(c => `<option value="${c.id}" ${c.id === categoryId ? 'selected' : ''}>${c.icon} ${c.label}</option>`).join('');

    renderChecklist();
    document.getElementById('serviceModal').classList.add('open');
  }

  function renderChecklist() {
    const vehicleId = document.getElementById('sVehicleId').value;
    const v = state.vehicles.find(item => item.id === vehicleId);
    const catId = document.getElementById('sCategory').value;
    const cats = CATEGORIES[v.type] || CATEGORIES.car;
    const cat = cats.find(c => c.id === catId) || cats[0];

    const box = document.getElementById('sChecklist');
    box.innerHTML = cat.items.map(item => `
      <label class="check-item">
        <input type="checkbox" value="${item}" />
        <span>${item}</span>
      </label>
    `).join('');
  }

  async function saveService(e) {
    e.preventDefault();
    const vehicleId = document.getElementById('sVehicleId').value;
    const v = state.vehicles.find(item => item.id === vehicleId);
    const catId = document.getElementById('sCategory').value;
    const cats = CATEGORIES[v.type] || CATEGORIES.car;
    const cat = cats.find(c => c.id === catId);

    const date = document.getElementById('sDate').value;
    const km = Number(document.getElementById('sKm').value);
    const checked = Array.from(document.querySelectorAll('#sChecklist input:checked')).map(el => el.value);
    const custom = document.getElementById('sCustomItems').value
      .split(',')
      .map(s => s.trim())
      .filter(Boolean);

    const remindKm = document.getElementById('sRemindKm').value ? Number(document.getElementById('sRemindKm').value) : null;
    const remindMonths = document.getElementById('sRemindMonths').value ? Number(document.getElementById('sRemindMonths').value) : null;
    const notes = document.getElementById('sNotes').value.trim();

    let attachment = null;
    const fileInput = document.getElementById('sAttachment');
    if (fileInput.files && fileInput.files[0]) {
      const file = fileInput.files[0];
      if (file.type.startsWith('image/')) {
        const compressed = await compressImage(file, 1200, 0.75);
        attachment = { name: file.name, type: 'image/jpeg', data: compressed };
      } else {
        const base64 = await fileToBase64(file);
        attachment = { name: file.name, type: file.type, data: base64 };
      }
    }

    state.services.push({
      id: 's_' + Date.now(),
      vehicleId,
      categoryId: cat.id,
      categoryLabel: `${cat.icon} ${cat.label}`,
      date,
      km,
      items: [...checked, ...custom],
      notes,
      remindKm,
      remindMonths,
      attachment
    });

    if (km > v.km) v.km = km;

    saveState();
    closeModal('serviceModal');
    render();
  }

  function deleteService(id) {
    if (!confirm('Supprimer cette intervention ?')) return;
    state.services = state.services.filter(s => s.id !== id);
    saveState();
    render();
  }

  function viewAttachment(serviceId) {
    const s = state.services.find(item => item.id === serviceId);
    if (!s || !s.attachment) return;
    document.getElementById('previewTitle').textContent = s.attachment.name || 'Facture';
    const container = document.getElementById('previewContent');
    if (s.attachment.type.includes('pdf')) {
      container.innerHTML = `<iframe src="${s.attachment.data}" style="width:100%; height:70vh; border:none; border-radius:8px;"></iframe>`;
    } else {
      container.innerHTML = `<img src="${s.attachment.data}" class="preview-box" alt="Justificatif" />`;
    }
    document.getElementById('previewModal').classList.add('open');
  }

  // Export Agenda (.ics)
  function downloadICS(vehicleName, categoryLabel, serviceDate, months) {
    const d = new Date(serviceDate);
    d.setMonth(d.getMonth() + Number(months || 12));
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    const dt = `${y}${m}${day}`;

    const ics = [
      'BEGIN:VCALENDAR',
      'VERSION:2.0',
      'BEGIN:VEVENT',
      `DTSTART;VALUE=DATE:${dt}`,
      `SUMMARY:Entretien ${vehicleName} - ${categoryLabel.replace(/[^\w\sÀ-ÿ-]/g, '').trim()}`,
      `DESCRIPTION:Rappel généré depuis Mon Garage`,
      'END:VEVENT',
      'END:VCALENDAR'
    ].join('\r\n');

    const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `rappel-${vehicleName.toLowerCase().replace(/\s+/g, '-')}.ics`;
    a.click();
    URL.revokeObjectURL(url);
  }

  // Sauvegarde / Restauration JSON
  function exportData() {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const date = new Date().toISOString().split('T')[0];
    a.href = url;
    a.download = `mon-garage-sauvegarde-${date}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }

  function importData(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const parsed = JSON.parse(e.target.result);
        if (parsed.vehicles && parsed.services) {
          state = parsed;
          state.currentVehicleId = null;
          saveState();
          render();
          alert('Sauvegarde restaurée avec succès !');
        } else {
          alert('Fichier JSON invalide.');
        }
      } catch (err) {
        alert('Erreur lors de la lecture du fichier.');
      }
    };
    reader.readAsText(file);
    event.target.value = '';
  }

  // Utilitaires fichiers & compression
  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function compressImage(file, maxWidth, quality) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          let w = img.width;
          let h = img.height;
          if (w > maxWidth) {
            h = Math.round((h * maxWidth) / w);
            w = maxWidth;
          }
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function closeModal(id) {
    document.getElementById(id).classList.remove('open');
  }

  loadState();
  render();
</script>
